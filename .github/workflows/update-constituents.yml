name: Update sector constituent lists

# Index constituents only change a few times a year (index reconstitutions).
# Run this manually (Actions tab -> this workflow -> Run workflow) after NSE
# announces a reconstitution, rather than on a schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-constituents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch constituent lists (niftyindices.com)
        run: npm run fetch:constituents

      - name: Build manifest
        run: npm run build:manifest

      - name: Commit updated constituents if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No constituent changes to commit."
          else
            git commit -m "chore: update sector constituent lists"
            git push
          fi
