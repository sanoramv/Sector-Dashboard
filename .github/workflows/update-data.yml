name: Update NSE sector data

on:
  schedule:
    # GitHub cron is UTC. 14:30 UTC = 20:00 IST, weekdays: a few hours after the
    # 15:30 IST close, once NSE has published the day's index/bhavcopy files.
    # GitHub often starts scheduled runs late (observed: up to ~8h).
    - cron: "30 14 * * 1-5"
    # 02:30 UTC = 08:00 IST, Tue-Sat: retries anything the evening run could not
    # get (late publication, transient network failure) before the next session.
    - cron: "30 2 * * 2-6"
    # Momentum Ledger capture slots (UTC). Scheduled runs are routinely delayed by hours, so
    # several slots exist; concurrency serialises them and a duplicate capture is a no-op.
    - cron: "0 16 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:
    inputs:
      max_backfill_dates:
        description: "Maximum OLDER dates to (re)fetch per archive this run (recent dates are always fetched). Use 300 to complete a full re-backfill in one run."
        required: false
        default: "40"

permissions:
  contents: write
  # Read-only: lets the ledger receipt step query the repository-activity API.
  actions: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # A routine run takes a few minutes; a 300-date backfill about 15. The cap
    # keeps a hung network from holding the concurrency group for hours.
    timeout-minutes: 60
    env:
      MAX_BACKFILL_DATES: ${{ github.event.inputs.max_backfill_dates || '40' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger receipt step needs full history (first-adding commit, ancestry).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each fetch step records every date's outcome in public/data/refresh-state.json
      # and only exits non-zero on a fatal error (e.g. unreadable data file).
      # Whether the refresh is complete is decided by build-manifest and enforced
      # by the final step, AFTER good data has been committed.
      - name: Fetch index history (official NSE archive)
        timeout-minutes: 20
        run: npm run fetch:index-history

      - name: Fetch equity bhavcopy (official NSE archive)
        timeout-minutes: 30
        run: npm run fetch:stocks

      # Supplementary (Next-Day Momentum catalysts): records a failed read as a
      # coverage gap inside announcements.json and never blocks the market-data
      # commit below. NSE's feed only holds the current day's filings.
      - name: Collect exchange filings (official NSE announcements feed)
        timeout-minutes: 5
        continue-on-error: true
        run: npm run fetch:announcements

      - name: Build manifest (evaluates the refresh outcome)
        run: npm run build:manifest

      # Momentum Ledger (Phase A1). A ledger fault must never block the market-data commit
      # below: these steps are non-blocking here, and the final "Ledger gate" step reads their
      # real outcomes (not just ledger-state.json) and turns the run red after the data commit.
      # Capture makes no network calls, so it is given no token.
      - name: Ledger capture (live Momentum snapshot)
        id: ledger_capture
        continue-on-error: true
        env:
          LEDGER_SLOT: ${{ github.event.schedule || 'manual' }}
        run: npm run ledger:capture -- --slot "$LEDGER_SLOT"

      # Only this step needs the token (repository-activity API read for publication receipts).
      - name: Ledger receipts (publication verification)
        id: ledger_verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ledger:verify

      - name: Remove interrupted ledger partial files
        if: ${{ always() }}
        run: find public/data/ledger -name '*.partial' -type f -print -delete || true

      # Fail-closed validation of the pending ledger changes BEFORE the data commit. On failure only
      # public/data/ledger is restored to HEAD and an anomaly is recorded; market data is untouched.
      - name: Ledger pre-commit validation
        id: ledger_precommit
        continue-on-error: true
        run: npm run ledger:precommit

      # If the validation above did not finish (it crashed, or its own rollback failed), put the ledger directory
      # back to the last commit. Skipped when the validation passed, or already rolled back and recorded the anomaly.
      - name: Ledger fail-safe restore
        id: ledger_failsafe
        if: ${{ steps.ledger_precommit.outcome != 'success' && steps.ledger_precommit.outputs.restored != 'true' }}
        continue-on-error: true
        run: bash scripts/ledger-failsafe-restore.sh

      - name: Validate the pipeline output with the test suite
        run: npm run test

      - name: Commit updated data if anything changed
        env:
          # Ledger changes join the commit only if validated (or already rolled back). Otherwise they are set aside.
          LEDGER_SAFE: ${{ steps.ledger_precommit.outcome == 'success' || steps.ledger_precommit.outputs.restored == 'true' || steps.ledger_failsafe.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/ledger-stage-data.sh
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: scheduled NSE sector data update"
          # main may have moved during the run (e.g. a code push): rebase the
          # data-only commit onto it instead of failing the push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit after 3 attempts."
          exit 1

      - name: Fail if a recent trading day is still missing
        run: npm run -s check:refresh

      # Runs last so that a ledger fault turns the run red AFTER the data commit has landed.
      - name: Ledger gate
        if: ${{ !cancelled() }}
        env:
          LEDGER_CAPTURE_OUTCOME: ${{ steps.ledger_capture.outcome }}
          LEDGER_VERIFY_OUTCOME: ${{ steps.ledger_verify.outcome }}
          LEDGER_PRECOMMIT_OUTCOME: ${{ steps.ledger_precommit.outcome }}
        run: npm run -s ledger:gate
