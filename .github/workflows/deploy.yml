name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Commits pushed by the scheduled data workflows use GITHUB_TOKEN, and GitHub
  # never fires a "push" event for those - so redeploy when they finish instead.
  workflow_run:
    workflows: ["Update NSE sector data", "Update sector constituent lists"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A data run that ends "failure" may still have committed valid data plus an
    # honest "refresh failed" status (check-refresh fails the job AFTER the
    # commit), so deploy after success or failure. Redeploying unchanged main
    # is harmless; cancelled/skipped runs are ignored.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          # Project Pages are served from https://<owner>.github.io/<repo>/ -
          # derive the base path from the repo name so no manual config is needed.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
